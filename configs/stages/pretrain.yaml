train:
  batch_size: 2
  grad_accum_steps: 32
  early_stopping: 70
  min_delta: 0
  log_every: 15

optim:
  lr: 3e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  clip: 1.0

scheduler:
  total_steps: 50000
  warmup_ratio: 0.01
  eta_min_ratio: 0.1
  start_factor: 0.25
  end_factor: 1.0

data:
  train_path: data/pretrain/embed_corpus_train
  valid_path: data/pretrain/embed_corpus_valid