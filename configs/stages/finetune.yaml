train:
  batch_size: 2
  grad_accum_steps: 32
  early_stopping: 40
  min_delta: 0
  log_every: 10

optim:
  lr: 3e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  clip: 1.0

scheduler:
  total_steps: 400
  warmup_ratio: 0.01
  eta_min_ratio: 0.01
  start_factor: 0.25
  end_factor: 1.0

data:
  train_path: data/finetune/qa_samples.json
  valid_path: data/finetune/qa_samples_val.json